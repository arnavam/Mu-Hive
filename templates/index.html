<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firecrawl Web Scraper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            color: #f8fafc;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-glow:focus {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
            border-color: #6366f1;
        }

        /* Custom Scrollbar for results */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Basic Markdown Parsing Styles */
        #markdown-output h1 { font-size: 2.25rem; font-weight: 700; margin-bottom: 1rem; color: #ffffff; }
        #markdown-output h2 { font-size: 1.75rem; font-weight: 600; margin-bottom: 0.75rem; color: #f8fafc; margin-top: 1.5rem; }
        #markdown-output h3 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; color: #e2e8f0; margin-top: 1rem; }
        #markdown-output a { color: #818cf8; text-decoration: underline; }
        #markdown-output p { margin-bottom: 1rem; line-height: 1.6; }
        #markdown-output ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        #markdown-output ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
        #markdown-output hr { border-color: #334155; margin: 2rem 0; }
        #markdown-output pre { background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1rem; }
        #markdown-output code { font-family: monospace; background: rgba(255,255,255,0.1); padding: 0.1rem 0.3rem; border-radius: 0.25rem; }
    </style>
</head>
<body class="p-6 md:p-12 flex flex-col items-center">

    <div class="w-full max-w-4xl flex flex-col gap-8">
        
        <!-- Header -->
        <header class="text-center space-y-2 mt-8">
            <h1 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">
                Web Scraper
            </h1>
            <p class="text-slate-400 text-lg">Extract data seamlessly with Firecrawl</p>
        </header>

        <!-- Main Form Panel -->
        <main class="glass-panel p-6 md:p-8 w-full transition-all duration-300">
            <form id="scrapper-form" class="flex flex-col gap-6">
                
                <div class="flex flex-col gap-2">
                    <label for="url" class="text-sm font-semibold text-slate-300">Target URL</label>
                    <input type="url" id="url" required placeholder="https://example.com"
                           class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg outline-none transition-all text-white input-glow placeholder-slate-500">
                </div>

                <div class="flex flex-col sm:flex-row gap-6">
                    <div class="flex-1 flex flex-col gap-2">
                        <label class="text-sm font-semibold text-slate-300">Mode</label>
                        <select id="mode" class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg outline-none transition-all text-white input-glow">
                            <option value="scrape">Scrape (Single Page)</option>
                            <option value="crawl">Crawl (Entire Site)</option>
                        </select>
                    </div>
                    
                    <div class="flex items-end">
                        <button type="submit" id="submit-btn"
                                class="w-full sm:w-auto px-8 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg shadow-lg shadow-indigo-500/30 transition-all transform hover:-translate-y-1 active:translate-y-0 flex items-center justify-center gap-2">
                            <span>Extract Data</span>
                            <svg id="loading-spinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

            </form>
        </main>

        <!-- Summary Panel -->
        <div id="summary-container" class="hidden glass-panel p-6 md:p-8 w-full flex-col gap-4 border-l-4 border-l-indigo-500 transition-all duration-500">
            <h2 class="text-xl font-bold text-indigo-300 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                AI Summary
            </h2>
            <div id="summary-content" class="text-slate-300 leading-relaxed prose prose-invert max-w-none">
                <!-- Summary will be injected here -->
            </div>
        </div>

        <!-- Results Panel -->
        <div id="results-container" class="hidden glass-panel p-6 md:p-8 w-full flex-col gap-4 transition-all duration-500 opacity-0 translate-y-4">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xl font-semibold text-indigo-300">Extraction Results</h2>
                <div class="flex items-center gap-3">
                    <button id="process-md-btn" class="hidden px-4 py-1.5 bg-purple-600 hover:bg-purple-500 text-white text-sm font-semibold rounded-lg transition-all shadow-lg hover:-translate-y-0.5">
                        Render Markdown
                    </button>
                    <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Success</span>
                </div>
            </div>
            
            <div class="bg-slate-900/80 rounded-lg p-5 border border-slate-700 overflow-y-auto relative" style="max-height: 500px;">
                <button id="copy-btn" class="absolute top-4 right-4 p-2 bg-slate-800 hover:bg-slate-700 rounded-md text-slate-300 transition-colors z-10" title="Copy Content">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
                <pre id="results-output" class="text-sm text-slate-300 font-mono whitespace-pre-wrap"></pre>
                <div id="markdown-output" class="hidden text-slate-300"></div>
            </div>
        </div>

    </div>

    <script>
        const form = document.getElementById('scrapper-form');
        const submitBtn = document.getElementById('submit-btn');
        const spinner = document.getElementById('loading-spinner');
        const btnText = submitBtn.querySelector('span');
        const resultsContainer = document.getElementById('results-container');
        const resultsOutput = document.getElementById('results-output');
        const markdownOutput = document.getElementById('markdown-output');
        const statusBadge = document.getElementById('status-badge');
        const copyBtn = document.getElementById('copy-btn');
        const processMdBtn = document.getElementById('process-md-btn');
        const summaryContainer = document.getElementById('summary-container');
        const summaryContent = document.getElementById('summary-content');

        let currentData = null;
        let showingMarkdown = false;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = document.getElementById('url').value;
            const mode = document.getElementById('mode').value;

            // UI Loading State
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            spinner.classList.remove('hidden');
            btnText.textContent = 'Processing...';
            
            // Hide previous results
            resultsContainer.classList.add('opacity-0', 'translate-y-4');
            summaryContainer.classList.add('hidden');
            setTimeout(() => resultsContainer.classList.add('hidden'), 300);

            try {
                const response = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, mode })
                });

                const data = await response.json();
                currentData = data;
                
                // Reset rendering states
                showingMarkdown = false;
                resultsOutput.classList.remove('hidden');
                markdownOutput.classList.add('hidden');
                processMdBtn.textContent = 'Render Markdown';

                // Show results
                resultsOutput.textContent = JSON.stringify(data.data || data, null, 2);
                
                // Show AI Summary if present
                if (data.summary) {
                    summaryContent.innerHTML = marked.parse(data.summary);
                    summaryContainer.classList.remove('hidden');
                }
                
                if (response.ok) {
                    processMdBtn.classList.remove('hidden');
                    statusBadge.textContent = 'Success';
                    statusBadge.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                } else {
                    processMdBtn.classList.add('hidden');
                    statusBadge.textContent = 'Error';
                    statusBadge.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-red-500/20 text-red-400 border border-red-500/30';
                }

                resultsContainer.classList.remove('hidden');
                // Small delay to ensure display: block is applied before animating
                setTimeout(() => {
                    resultsContainer.classList.remove('opacity-0', 'translate-y-4');
                }, 50);

            } catch (error) {
                resultsOutput.textContent = JSON.stringify({ error: error.message }, null, 2);
                statusBadge.textContent = 'Network Error';
                statusBadge.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-red-500/20 text-red-400 border border-red-500/30';
                
                resultsContainer.classList.remove('hidden');
                setTimeout(() => {
                    resultsContainer.classList.remove('opacity-0', 'translate-y-4');
                }, 50);
            } finally {
                // UI Restore State
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                spinner.classList.add('hidden');
                btnText.textContent = 'Extract Data';
            }
        });

        processMdBtn.addEventListener('click', () => {
            showingMarkdown = !showingMarkdown;
            if (showingMarkdown) {
                // Switch to markdown view
                processMdBtn.textContent = 'View Raw JSON';
                resultsOutput.classList.add('hidden');
                markdownOutput.classList.remove('hidden');
                
                let mdText = '';
                const baseData = currentData.data || currentData;
                
                if (baseData.markdown) {
                    mdText = baseData.markdown;
                } else if (Array.isArray(baseData)) {
                    mdText = baseData.map(d => d.markdown).join('\n\n---\n\n');
                } else if (baseData.data && Array.isArray(baseData.data)) {
                    mdText = baseData.data.map(d => d.markdown || d.content || d.text).join('\n\n---\n\n');
                } else {
                    mdText = '_No markdown content found._';
                }
                
                markdownOutput.innerHTML = marked.parse(mdText);
            } else {
                // Switch to JSON view
                processMdBtn.textContent = 'Render Markdown';
                resultsOutput.classList.remove('hidden');
                markdownOutput.classList.add('hidden');
            }
        });

        copyBtn.addEventListener('click', () => {
            const content = showingMarkdown ? markdownOutput.innerText : resultsOutput.textContent;
            navigator.clipboard.writeText(content);
            
            // Visual feedback
            const originalIcon = copyBtn.innerHTML;
            copyBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>';
            setTimeout(() => {
                copyBtn.innerHTML = originalIcon;
            }, 2000);
        });
    </script>
</body>
</html>
