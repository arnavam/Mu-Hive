# MuHive System-Wide Configuration

# Blocklist for filtering
blocklist:
  words:
    - sponsored
    - advertisement
    - giveaway
    - crypto
    - NFT
    - casino
    - "click here"
    - "make money"
    - "earn from home"
  domains:
    - scam-site.xyz
    - spam.com

# Interest Group Definitions
interest_groups:
  AI:
    label: Artificial Intelligence
    active: true
    keywords:
      - machine learning
      - LLM
      - deep learning
      - neural network
      - computer vision
    categories:
      - hackathon
      - workshop
      - internship
      - research
      - news
  Cybersecurity:
    label: Cybersecurity
    active: true
    keywords:
      - CTF
      - infosec
      - ethical hacking
      - penetration testing
      - OSINT
    categories:
      - CTF
      - workshop
      - internship
      - news
  WebDev:
    label: Web Development
    active: true
    keywords:
      - React
      - Node
      - frontend
      - backend
      - API
    categories:
      - hackathon
      - workshop
      - internship
      - news
  DataScience:
    label: Data Science
    active: true
    keywords:
      - data science
      - kaggle
      - analytics
      - pandas
      - visualization
    categories:
      - competition
      - workshop
      - internship
      - news
  OpenSource:
    label: Open Source
    active: false
    keywords:
      - open source
      - GSoC
      - MLH
      - contribution
      - GitHub
    categories:
      - program
      - internship
      - event
      - news

# LLM Providers and Models
models:
  providers:
    groq:
      base_url: "https://api.groq.com/openai/v1"
      api_key_env: "GROQ_API_KEY"
      rpm: 30
    openrouter:
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: "OPENROUTER_API_KEY"
      rpm: 10
  roles:
    verifier:
      cheap:
        provider: "groq"
        model: "llama-3.1-8b-instant"
        temperature: 0.1
        max_tokens: 500
      premium:
        provider: "groq"
        model: "llama-3.3-70b-versatile"
        temperature: 0.1
        max_tokens: 500
      fallback:
        provider: "openrouter"
        model: "openai/gpt-oss-120b:free"
        temperature: 0.1
        max_tokens: 500
    structurer:
      cheap:
        provider: "groq"
        model: "llama-3.1-8b-instant"
        temperature: 0.1
        max_tokens: 500
      premium:
        provider: "groq"
        model: "llama-3.3-70b-versatile"
        temperature: 0.1
        max_tokens: 500
      fallback:
        provider: "openrouter"
        model: "openai/gpt-oss-120b:free"
        temperature: 0.1
        max_tokens: 500

# Pipeline Settings
pipeline:
  max_concurrent_scrapers: 3
  llm_rpm: 12
  search_rpm: 5
  min_verified_score: 0.5
  seen_hashes_file: data/seen_hashes.json
  circuit_state_file: data/circuit_state.json
  retry_backoff_seconds: [1, 2, 4]
  max_retries: 3
  verifier_concurrency: 1
  structurer_concurrency: 1
  circuit_cooldown_seconds: 300
  max_premium_items_per_run: 50
  
  ig_routing:
    AI:
      verifier: "cheap"
      structurer: "cheap"
    Cybersecurity:
      verifier: "cheap"
      structurer: "cheap"
    default:
      verifier: "cheap"
      structurer: "cheap"

  rate_limits:
    groq:
      max_rpm: 30
    openrouter:
      max_rpm: 10

  search:
    primary: "duckduckgo"
    fallback: "tavily"

  per_ig_limits:
    AI:
      max_verified: 20
      max_structured: 20
    default:
      max_verified: 10
      max_structured: 10

