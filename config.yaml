# ──────────────────────────────────────────────
# MuLearn Stage 2 Pipeline — Configuration
# ──────────────────────────────────────────────

stage2:
  # ── Parallelism ──
  max_parallel: 1

  # ── Score Thresholds ──
  score_thresholds:
    auto_fail: 2.5        # rough_score < this → fail
    review: 3.5           # rough_score < this → review
    pass: 3.5             # rough_score >= this → pass

  group_slice_min_score: 2.5
  trust_threshold_for_ready: 60   # final trust score threshold for ready_for_stage3
  default_source_tier: 0.5

  # ── Retry / Circuit Breaker ──
  max_retries: 3
  retry_backoff_seconds: [1, 2, 4]
  circuit_breaker_cooldown_minutes: 10

  # ── Blocklist (pre-filter rejects if any word found) ──
  blocklist:
    - sponsored
    - advertisement
    - giveaway
    - crypto
    - NFT
    - casino

  # ── Source Trust Tiers (0.0–1.0) ──
  source_tiers:
    devpost.com: 1.0
    kaggle.com: 1.0
    arxiv.org: 1.0
    techcrunch.com: 0.9
    hackernews.com: 0.9
    ieee.org: 1.0
    reddit.com: 0.6
    mlh.io: 1.0

  # ── Interest Groups (3 for now — add more via config only) ──
  groups:
    AI:
      keywords:
        - machine learning
        - LLM
        - NLP
        - computer vision
        - robotics
        - AI
        - deep learning
        - neural network
        - transformer
        - generative
    Cybersecurity:
      keywords:
        - infosec
        - CTF
        - ethical hacking
        - network security
        - penetration
        - OSINT
        - cybersecurity
        - malware
        - vulnerability
        - exploit
    WebDev:
      keywords:
        - frontend
        - backend
        - fullstack
        - API
        - framework
        - React
        - Node
        - CSS
        - web development
        - JavaScript
        - TypeScript

  # ── Search (Tavily primary, DuckDuckGo fallback) ──
  search:
    primary: tavily
    fallback: duckduckgo
    trigger_min_rough_score: 3.0
    max_results: 3

  # ── Trust Score Weights ──
  trust_weights:
    relevance: 0.20
    source_tier: 0.15
    detail: 0.15
    consistency: 0.15
    penalty_missing: 0.10
    grounding: 0.10
    verification: 0.15

  # ── LLM Adapters ──
  adapters:
    primary_fast: groq
    primary_quality: gemini
    fallback: openrouter

  # ── Model Names ──
  models:
    groq: "llama-3.1-8b-instant"
    gemini: "gemini-2.5-flash-lite"
    openrouter_fast: "meta-llama/llama-3.1-8b-instruct:free"
    openrouter_quality: "google/gemini-2.5-flash-lite:free"
